<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorldQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* Layout: one app, views by #hash. Teacher = tabbed workspace (Unit, Quest builder = chat + board, Partners). Students = one phone column. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#e9edf4; --line:#d5dbe6;
  --ink:#141b2b; --muted:#5a6478;
  --accent:#2d55e0; --accent-ink:#ffffff; --accent-soft:#e3e9fd;
  --ok:#11826f; --ok-soft:#dcf2ed; --warn:#a8650a; --warn-soft:#fbefd9; --bad:#c23a3a; --bad-soft:#fbe3e3;
  --ai:#7a3fd1; --ai-soft:#efe6fb; --gold:#c08a12; --gold-soft:#fbf1d6;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#171e2e; --sunk:#111827; --line:#2a3448; --ink:#e9edf6; --muted:#9aa5bb;
  --accent:#6f8dff; --accent-ink:#0b1020; --accent-soft:#1d2a52; --ok:#3fc7ac; --ok-soft:#123a34;
  --warn:#f0b04a; --warn-soft:#3a2c12; --bad:#ff7a7a; --bad-soft:#3d1b1b; --ai:#b88cff; --ai-soft:#2c1f45;
  --gold:#f0c24c; --gold-soft:#3a3013; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171e2e; --sunk:#111827; --line:#2a3448; --ink:#e9edf6; --muted:#9aa5bb;
  --accent:#6f8dff; --accent-ink:#0b1020; --accent-soft:#1d2a52; --ok:#3fc7ac; --ok-soft:#123a34;
  --warn:#f0b04a; --warn-soft:#3a2c12; --bad:#ff7a7a; --bad-soft:#3d1b1b; --ai:#b88cff; --ai-soft:#2c1f45;
  --gold:#f0c24c; --gold-soft:#3a3013; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
button,.btn{font:600 14px var(--f-body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:transparent;border-color:transparent}
.big{display:flex;width:100%;padding:14px;font-size:16px}
.tiny{padding:5px 9px;font-size:12px;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea,select{font:15px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ai{background:var(--ai-soft);color:var(--ai)} .chip.edit{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.lock{background:var(--sunk);color:var(--muted)}
.chip.sim{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.wrap{max-width:1180px;margin:0 auto} .phone{max-width:430px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:18px;color:inherit;text-decoration:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
svg.i{width:16px;height:16px;flex:none}
/* home */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:28px}
.choice{flex-direction:column;align-items:flex-start;text-align:left;padding:18px;gap:4px}
.choice:hover{border-color:var(--accent)}
/* teacher tabs */
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:7px 14px;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* builder */
.builder{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.builder{grid-template-columns:1fr}.chat{position:static!important;height:520px!important}}
.chat{display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:460px;position:sticky;top:12px;padding:12px}
.chat-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;border-bottom:1px solid var(--line)}
.avatar{width:28px;height:28px;border-radius:9px;background:var(--ai);display:grid;place-items:center;color:#fff;flex:none}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 2px}
.msg{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45}
.msg.t{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg .row{margin-top:6px;gap:4px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ai);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}
.sugg button{font-size:13px;padding:6px 11px;border-radius:999px;background:var(--ai-soft);color:var(--ai);border-color:transparent}
.sugg button.rev{background:var(--surface);border-color:var(--ai)}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0}
.board{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel-h h3{display:flex;align-items:center;gap:8px}
.count{font:600 12px var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.c{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.c.accepted{border-color:var(--ok)}
.c.focus{box-shadow:0 0 0 2px var(--ai)}
.c .body{font-size:14px}
.c .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--ai);transform:translateY(4px)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.cite{font:600 11px var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.opts li{display:flex;gap:6px;align-items:baseline}
.opts li.correct{color:var(--ok);font-weight:600}
.src{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:14px}
.src.hl{box-shadow:0 0 0 2px var(--accent)}
.src .kind{font:600 10px var(--f-mono);padding:3px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.snip{grid-column:1/-1;font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px}
.gen{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}.gen b{display:block;height:100%;background:var(--gold);transition:width .3s}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle input{width:auto}
/* unit */
.flow{display:flex;flex-direction:column;align-items:stretch;max-width:680px}
.node{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.node .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.node.exp .ic{background:var(--gold-soft);color:var(--gold)}
.node.locked .ic{background:var(--sunk);color:var(--muted)}
.link{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;margin:6px 0}
.link .ln{justify-self:center;width:2px;height:44px;background:var(--line)}
.link select{width:auto;font-size:13px;padding:6px 10px}
.addmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.addmenu button{flex-direction:column;align-items:flex-start;text-align:left;padding:14px;gap:4px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar b{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.unlock{animation:pop .6s ease-out}
/* partners */
.pipe{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pipe .s{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.pipe .s b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font:600 11px var(--f-mono)}
.pipe .s.on{color:var(--ink)}.pipe .s.on b{background:var(--accent);color:var(--accent-ink)}
.pipe .s.done b{background:var(--ok);color:var(--accent-ink)}
.pipe i{width:24px;height:2px;background:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.inbox{background:var(--sunk);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mail{white-space:pre-wrap;font-size:14px;background:var(--surface);border-radius:10px;padding:12px;border:1px solid var(--line)}
/* student */
.steps{display:flex;gap:4px;margin:2px 0 16px;cursor:default}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.role-badge{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.riddle{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.25}
.away{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:14px}
.map svg{width:100%;height:auto;display:block}
.map .case{cursor:pointer}.map .case rect{fill:var(--surface);stroke:var(--line);stroke-width:2}
.map .case.sel rect{stroke:var(--accent);stroke-width:3;fill:var(--accent-soft)}
.map .case.bad rect{stroke:var(--warn);fill:var(--warn-soft)}
.map text{fill:var(--ink);font:600 13px var(--f-body)}.map .wall{fill:none;stroke:var(--muted);stroke-width:3}.map .faint{fill:var(--muted);font-size:11px;font-weight:500}
.vf{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#0b0f19;display:grid;place-items:center;color:#c9d1e3;text-align:center}
.vf video,.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;inset:16% 12%;border:3px solid rgba(255,255,255,.85);border-radius:18px;transition:border-color .3s}
.reticle.hit{border-color:#3fe0b8;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.scanline{position:absolute;left:12%;right:12%;height:3px;background:#7fa0ff;box-shadow:0 0 16px #7fa0ff;animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{top:18%}to{top:82%}}
.detect{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(12,16,28,.86);color:#fff;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.qopt{display:flex;width:100%;justify-content:flex-start;text-align:left;padding:13px 14px;font-weight:500}
.qopt:disabled{opacity:1;cursor:default}
.qopt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:12px}
.collectible{perspective:800px;display:grid;place-items:center;padding:8px 0}
.coll-card{width:210px;aspect-ratio:3/4;border-radius:18px;background:linear-gradient(160deg,var(--gold-soft),var(--surface));border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;animation:spin3d 6s ease-in-out infinite}
.coll-card.evolved{border-width:3px;box-shadow:0 0 0 6px var(--gold-soft),0 0 40px var(--gold)}
@keyframes spin3d{0%,100%{transform:rotateY(-18deg)}50%{transform:rotateY(18deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s ease-out both}
.jitem{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.mini{width:52px;height:52px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold);display:grid;place-items:center}
.overlay{position:fixed;inset:0;background:rgba(8,12,22,.7);display:grid;place-items:center;z-index:30;padding:16px}
.overlay .card{max-width:360px;width:100%;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.hint{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="overlay" class="overlay" hidden></div>

<script>
/* ===== utilities ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const IC={
  plus:'<path d="M8 3v10M3 8h10"/>', check:'<path d="M3 8.5l3 3 7-7"/>', edit:'<path d="M3 13h3l7-7-3-3-7 7z"/>',
  chat:'<path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/>', send:'<path d="M2 8l12-5-5 12-2-5z"/>', spark:'<path d="M8 1.5l1.6 4.9 4.9 1.6-4.9 1.6L8 14.5l-1.6-4.9L1.5 8l4.9-1.6z"/>',
  doc:'<path d="M4 1.5h5l3 3v10H4z M9 1.5v3h3"/>', map:'<path d="M1.5 3.5l4-1.5 5 2 4-1.5v10l-4 1.5-5-2-4 1.5z M5.5 2v10 M10.5 4v10"/>',
  brush:'<path d="M10 2l4 4-6 6-4-4z M4 8l-2.5 6.5L8 12"/>', lock:'<path d="M4 7h8v7H4z M5.5 7V5a2.5 2.5 0 015 0v2"/>',
  cam:'<path d="M1.5 5h3l1.5-2h4L11.5 5h3v8h-13z"/><circle cx="8" cy="9" r="2.5"/>', mail:'<path d="M1.5 3.5h13v9h-13z M1.5 4l6.5 5 6.5-5"/>',
  play:'<path d="M5 3l8 5-8 5z"/>', users:'<circle cx="5.5" cy="5" r="2.2"/><circle cx="11" cy="5.5" r="1.8"/><path d="M1.5 13c.5-2.5 2-3.6 4-3.6s3.5 1.1 4 3.6 M10 9.6c1.9 0 3.6.9 4.2 3"/>'
};
const ic=(n,s=16)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const logo=`<svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M15 6 L18 15 L15 24 L12 15 Z" fill="var(--accent)"/><circle cx="15" cy="15" r="2.5" fill="var(--surface)"/></svg>`;
function watchArt(size=120,evolved=false){const c=evolved?"var(--gold)":"var(--ink)";return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" aria-label="Skull watch">
 ${evolved?'<circle cx="60" cy="66" r="52" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 6"/>':''}
 <circle cx="60" cy="14" r="7" fill="none" stroke="${c}" stroke-width="4"/><rect x="55" y="19" width="10" height="8" rx="2" fill="${c}"/>
 <ellipse cx="60" cy="66" rx="36" ry="40" fill="var(--surface)" stroke="${c}" stroke-width="5"/>
 <circle cx="46" cy="60" r="8" fill="${c}"/><circle cx="74" cy="60" r="8" fill="${c}"/><path d="M60 70 l-5 9 h10 z" fill="${c}"/>
 <path d="M44 90 h32 M50 86 v8 M56 86 v8 M62 86 v8 M68 86 v8" stroke="${c}" stroke-width="3" fill="none"/>
 ${evolved?'<path d="M96 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="var(--gold)"/>':''}</svg>`}
function badgeArt(size=60){return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" aria-label="Timekeeper badge"><path d="M30 4l7 6 9-1 2 9 8 5-4 8 4 8-8 5-2 9-9-1-7 6-7-6-9 1-2-9-8-5 4-8-4-8 8-5 2-9 9 1z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/><circle cx="30" cy="30" r="11" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M30 23v7l5 3" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`}
function domeArt(size=60){return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" aria-label="Look Up easter egg"><path d="M8 44a22 22 0 0144 0z" fill="var(--ai-soft)" stroke="var(--ai)" stroke-width="2.5"/><path d="M30 22v22 M19 26l5 18 M41 26l-5 18 M8 44h44" stroke="var(--ai)" stroke-width="2"/><circle cx="30" cy="16" r="4" fill="var(--ai)"/></svg>`}
function makeQR(el,text){el.innerHTML="";if(window.QRCode)new QRCode(el,{text,width:190,height:190,colorDark:"#141b2b",colorLight:"#ffffff"});else el.innerHTML=`<p class="mono">${esc(text)}</p>`}
function readQRFromFile(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1000/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=img.width*s;cv.height=img.height*s;const cx=cv.getContext("2d");cx.drawImage(img,0,0,cv.width,cv.height);try{const d=cx.getImageData(0,0,cv.width,cv.height);const r=window.jsQR?jsQR(d.data,cv.width,cv.height):null;res(r?r.data:null)}catch{res(null)}};img.onerror=()=>res(null);img.src=URL.createObjectURL(file)})}

/* ===== shared content ===== */
const CODES={session:"FITZ-26",pair:"WQ-PAIR-7F3K",checkin:"WQ-CHECKIN-DRAW26"};

function renderChat(){
  const m=$("#msgs");if(!m)return;
  m.innerHTML=B.msgs.map(x=>`<div class="msg ${x.who}">${x.thinking?`<span class="dots"><i></i><i></i><i></i></span>`:esc(x.text)}
    ${x.cites&&x.cites.length?`<div class="row">${x.cites.map(id=>`<button class="cite" data-cite="${id}">${id}</button>`).join("")}</div>`:""}</div>`).join("");
  m.scrollTop=m.scrollHeight;
  $$("#msgs [data-cite]").forEach(b=>b.onclick=()=>showSource(b.dataset.cite));
  const s=$("#sugg");const chips=[];
  if(B.focus){const r=REV.find(r=>r.target===B.focus&&!B.done.has(r.id));if(r)chips.push(r)}
  const next=MAIN.find(x=>!B.done.has(x.id));if(next)chips.push(next);
  REV.filter(r=>!B.done.has(r.id)&&find(r.target)&&!chips.includes(r)).slice(0,2).forEach(r=>chips.push(r));
  s.innerHTML=chips.slice(0,3).map(c=>`<button data-chip="${c.id}" class="${c.target?"rev":""}" ${B.busy?"disabled":""}>${c.target?ic("edit"):ic("spark")} ${esc(c.chip)}</button>`).join("");
  $$("[data-chip]").forEach(b=>b.onclick=()=>runPrompt([...MAIN,...REV].find(x=>x.id===b.dataset.chip)));
}
async function aiSay(text,cites){const m={who:"a",text:"",thinking:true};B.msgs.push(m);renderChat();await sleep(800+Math.random()*500);m.thinking=false;
  for(const w of text.split(" ")){m.text+=(m.text?" ":"")+w;renderChat();await sleep(32)}m.cites=cites}
const KW={task:["plan","trip"],roles:["role"],quests:["quest"],quiz:["quiz","question","mcq"],colls:["collectible","badge","reward","easter"],
  "rev-task":["minute","shorter"],"rev-r2":["navigator","sketch"],"rev-q2":["attendant","backup"],"rev-m3":["q3","observation"],"rev-c3":["share","both"]};
function matchItem(text){const t=text.toLowerCase();
  return [...REV.filter(r=>find(r.target)),...MAIN].find(x=>!B.done.has(x.id)&&KW[x.id].some(k=>t.includes(k)))}
async function runPrompt(item,typed){
  if(B.busy||!item)return;B.busy=true;B.started=true;renderChat();
  const inp=$("#cin");if(inp&&!typed){inp.value="";for(const ch of item.prompt){inp.value+=ch;await sleep(12)}await sleep(250)}if(inp)inp.value="";
  B.msgs.push({who:"t",text:typed||item.prompt});renderChat();
  await aiSay(typeof item.reply==="function"?item.reply():item.reply);
  item.apply();B.done.add(item.id);
  const cards=item.target?[find(item.target)]:{task:[B.task],roles:B.roles,quests:B.quests,quiz:B.quiz,colls:B.colls}[item.id];
  cards.forEach(c=>item.target?revise(c,"revised"):(c.flash=true));
  B.msgs[B.msgs.length-1].cites=[...new Set(cards.flatMap(c=>c.cites||[]))];
  B.focus=null;B.busy=false;renderChat();renderBoard();
}
let samplePromise=null;
async function freeSend(text){
  const hit=matchItem(text);if(hit)return runPrompt(hit,text);
  B.busy=true;B.started=true;$("#cin").value="";B.msgs.push({who:"t",text});renderChat();
  const focus=B.focus&&find(B.focus);let reply=null;
  try{const sample=await(samplePromise??=(window.claude?.use?window.claude.use("sample"):Promise.resolve(null)));
    if(sample){const ctx=JSON.stringify(allCards().map(c=>({id:c.id,title:c.title,body:c.body||c.q})));
      const r=await sample(`You are the quest assistant in WorldQuest, helping a teacher plan a museum trip (Fitzwilliam Museum, Year 10, pairs, memento mori). Current draft cards: ${ctx}. ${focus?`The teacher is asking about card "${focus.title}".`:""} Reply in at most 2 short sentences with a concrete suggestion. Teacher: ${text}`,{modelTier:"quick",cache:false});reply=r.text}}catch{}
  await aiSay(reply||"Got it. In the full version I'd update the draft on the right — try one of the suggestions below for this demo.");
  B.busy=false;renderChat();
}

const STATE={ai:`<span class="chip ai">${ic("spark")} AI draft</span>`,revised:`<span class="chip ai">${ic("spark")} Revised</span>`,edited:`<span class="chip edit">${ic("edit")} Edited by you</span>`,accepted:`<span class="chip ok">${ic("check")} Accepted</span>`};
function cardHTML(c){
  const cites=(c.cites||[]).map(id=>`<button class="cite" data-cite="${id}">${id}</button>`).join("");
  let body="";
  if(c.editing){
    if(c.kind==="quiz") body=`<input data-f="q" value="${esc(c.q)}">${c.o.map((o,i)=>`<label class="row" style="flex-wrap:nowrap"><input type="radio" name="a-${c.id}" value="${i}" ${i===c.a?"checked":""} style="width:auto"><input data-o="${i}" value="${esc(o)}"></label>`).join("")}`;
    else if(c.kind==="task") body=c.fields.map((f,i)=>`<label class="small">${f[0]}<input data-tf="${i}" value="${esc(f[1])}"></label>`).join("");
    else body=`<input data-f="title" value="${esc(c.title)}"><textarea data-f="body">${esc(c.body)}</textarea>`;
    return `<div class="c focus" id="card-${c.id}">${body}<div class="acts"><button class="tiny primary" data-save="${c.id}">Save</button><button class="tiny" data-cancel="${c.id}">Cancel</button></div></div>`;
  }
  if(c.kind==="quiz") body=`<b class="body">${esc(c.q)}</b><ol class="opts">${c.o.map((o,i)=>`<li class="${i===c.a?"correct":""}">${i===c.a?ic("check",13):"<span style='width:13px'></span>"}${esc(o)}</li>`).join("")}</ol>`;
  else if(c.kind==="task") body=`<b class="body">${esc(c.title)}</b><dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px">${c.fields.map(f=>`<dt class="muted">${f[0]}</dt><dd style="margin:0">${esc(f[1])}</dd>`).join("")}</dl>`;
  else if(c.kind==="coll"){const art=c.art==="watch"?watchArt(54):c.art==="badge"?badgeArt(50):domeArt(50);
    const gen=c.art==="watch"&&c.gen<100;
    body=`<div class="row" style="flex-wrap:nowrap;align-items:center"><div class="mini" style="flex:none">${gen?`<span class="small mono">${c.gen}%</span>`:art}</div><div style="min-width:0"><span class="label">${c.type}</span><br><b>${esc(c.title)}</b></div></div><p class="small">${esc(c.body)}</p>
     ${c.art==="watch"?(gen?`<div class="gen"><b id="gen-c1" style="width:${c.gen}%"></b></div><span class="small muted">Generating in Manifest…</span>`:`<span class="chip sim">Manifest 3D (simulated)</span>`):""}`}
  else body=`<b>${esc(c.title)}</b><p class="body">${esc(c.body)}</p>`;
  return `<div class="c ${c.state==="accepted"?"accepted":""} ${B.focus===c.id?"focus":""} ${c.flash?"flash":""}" id="card-${c.id}">
    <div class="row between">${STATE[c.state]}<span class="row" style="gap:3px">${cites}</span></div>${body}
    <div class="acts">${c.state==="accepted"?`<button class="tiny ghost" data-unaccept="${c.id}">Undo</button>`:`<button class="tiny primary" data-accept="${c.id}">${ic("check",13)} Accept</button>`}
     <button class="tiny" data-edit="${c.id}">${ic("edit",13)} Edit</button><button class="tiny" data-ask="${c.id}">${ic("chat",13)} Ask AI</button></div></div>`;
}
function section(title,icon,cards,emptyText,key){
  const acc=cards.filter(c=>c.state==="accepted").length;
  return `<section class="panel"><div class="panel-h"><h3>${ic(icon)} ${title}</h3><span class="row">${cards.length?`<span class="count">${acc}/${cards.length}</span>${acc<cards.length?`<button class="tiny" data-accall="${key}">Accept all</button>`:""}`:""}</span></div>
   ${cards.length?`<div class="cards">${cards.map(cardHTML).join("")}</div>`:`<div class="empty">${emptyText}</div>`}</section>`;
}
function renderBoard(){

let stream=null,scanLoop=null;
function stopCam(){clearInterval(scanLoop);scanLoop=null;stream?.getTracks().forEach(t=>t.stop());stream=null}
async function openCam(video){if(!navigator.mediaDevices?.getUserMedia)throw new Error("nocam");
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;await video.play()}
function startQRScan(video,expected,onHit){const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  scanLoop=setInterval(()=>{if(!video.videoWidth||!window.jsQR)return;const s=Math.min(1,640/video.videoWidth);cv.width=video.videoWidth*s;cv.height=video.videoHeight*s;
    cx.drawImage(video,0,0,cv.width,cv.height);const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r&&r.data===expected){stopCam();onHit()}},280)}

/* tilt easter egg */
let tiltArmed=false,upSince=0;
function armTilt(){
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function")DeviceOrientationEvent.requestPermission().catch(()=>{});
  if(tiltArmed)return;tiltArmed=true;
  addEventListener("deviceorientation",e=>{if(e.beta==null)return;const up=Math.abs(e.beta)>140;
    if(up){upSince||=Date.now();if(Date.now()-upSince>700)foundEgg()}else upSince=0});
}

    <div class="jitem"><div class="mini">${watchArt(42)}</div><div><b>Memento Mori Watch</b><p class="small muted">Discovery · Level 1</p></div></div>
    ${badge?`<div class="jitem"><div class="mini" style="background:var(--accent-soft);border-color:var(--accent)">${badgeArt(40)}</div><div><b>Timekeeper</b><p class="small muted">Knowledge</p></div></div>`:""}
    ${s.egg?`<div class="jitem"><div class="mini" style="background:var(--ai-soft);border-color:var(--ai)">${domeArt(40)}</div><div><b>Look Up</b><p class="small muted">Easter egg</p></div></div>`:`<div class="jitem" style="opacity:.55"><div class="mini" style="background:var(--sunk);border-color:var(--line)">?</div><div><b>Hidden</b><p class="small muted">Explorers notice more</p></div></div>`}
    <div class="jitem"><div class="mini" style="background:var(--accent-soft);border-color:var(--accent)">${ic("edit",20)}</div><div><b>Discovery card</b><p class="small"><span class="chip edit">Teacher reviewing</span></p></div></div>
   </div>
   <div class="card stack"><div class="row between"><span class="label">Up next</span><span class="chip lock">${ic("lock",12)} 24/28 finished</span></div><h3>Still-life drawing class</h3><p class="small muted">Riverside Art Studio · Thu 3 Dec</p></div>
   <button class="big" id="go">Demo: jump to class day</button>`;
  $("#go").onclick=()=>next(role)},
 checkin(role,s){
  if(s.evolved){
   $("#smain").innerHTML=`<div style="text-align:center" class="stack"><span class="label">Evolved</span><h1 style="font-size:30px">Memento Mori Watch</h1></div>
    <div class="collectible pop"><div class="coll-card evolved">${watchArt(130,true)}<span class="label" style="color:var(--gold)">Level 2 · Applied</span></div></div>
    <div class="card stack"><label for="refl">What did the watch help you notice in your drawing?</label><textarea id="refl"></textarea><button class="primary" id="done">Save</button></div>`;
   $("#done").onclick=()=>toast("Saved. Phones away, enjoy the class.");return}
  $("#smain").innerHTML=`<div><span class="label">Class unlocked</span><h2>Check in at the studio</h2></div>
   <div class="vf" style="aspect-ratio:1"><video id="vid" playsinline muted></video><span id="vfmsg" style="position:relative;padding:20px">Starting camera…</span><div class="reticle" style="inset:18%"></div></div>
   <div id="camfail" hidden><label class="btn primary big" for="cap">${ic("cam")} Photograph the code</label><input id="cap" type="file" accept="image/*" capture="environment" hidden></div>
   <button id="skip">No phone? Teacher checks you in</button>`;
  const ok=()=>{stopCam();s.evolved=true;toast("Checked in. Your collectible evolved!");renderStudent(role)};
  openCam($("#vid")).then(()=>{$("#vfmsg").remove();startQRScan($("#vid"),CODES.checkin,ok)}).catch(()=>{$("#vfmsg").textContent="Camera not available here";$("#camfail").hidden=false;
    $("#cap").onchange=async e=>{const f=e.target.files[0];if(f&&await readQRFromFile(f)===CODES.checkin)ok();else toast("Couldn't read it. Try again.")}});
  $("#skip").onclick=ok}
};

route();
</script>
